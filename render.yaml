# ==============================================================================
# REBCO System - Render.com Blueprint (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # UNIFIED FULL-STACK WEB SERVICE (FastAPI + React SPA Frontend)
  # ----------------------------------------------------------------------------
  - type: web
    name: rebco-portal
    env: python
    plan: starter # or free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: "./render-build.sh"
    startCommand: "cd backend && python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: rebco-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: "./private_uploads"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
      - key: SERVE_FRONTEND
        value: "true"

  # ----------------------------------------------------------------------------
  # OPTIONAL: DEDICATED FRONTEND STATIC SITE (If running frontend separately)
  # ----------------------------------------------------------------------------
  # - type: web
  #   name: rebco-frontend-static
  #   env: static
  #   buildCommand: "cd frontend && npm install && npm run build"
  #   staticPublishPath: "./frontend/dist"
  #   routes:
  #     - type: rewrite
  #       source: "/*"
  #       destination: "/index.html"
  #   envVars:
  #     - key: VITE_API_URL
  #       fromService:
  #         type: web
  #         name: rebco-portal
  #         property: host

# ------------------------------------------------------------------------------
# MANAGED POSTGRESQL DATABASE
# ------------------------------------------------------------------------------
databases:
  - name: rebco-database
    databaseName: rebco
    user: rebco_user
    plan: free # or starter
    region: oregon
    postgresMajorVersion: "16"

